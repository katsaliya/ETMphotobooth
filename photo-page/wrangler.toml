# Emporium Thai Market photobooth — guest photo pages.
# Setup steps: see README.md.
name = "etm-photobooth"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Logo and other static files. The Worker runs first for /api and /p routes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "etm-photobooth"

# BOOTH_KEY is a secret, not set here:
#   production:  npx wrangler secret put BOOTH_KEY
#   local dev:   put BOOTH_KEY=... in .dev.vars
